<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Vicky Mans Wear</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><span>VM</span><b>Vicky Mans Wear</b></a><a href="index.html">← Shop</a></header><main class="checkout"><div><small>SECURE LOCAL CHECKOUT</small><h1>Delivery Details</h1><p>COD only • Ghughri se <b>10 KM ke andar</b> delivery.</p><form id="f"><label>Name<input name="name" required placeholder="Aapka naam"></label><label>Mobile<input name="mobile" pattern="[0-9]{10}" inputmode="numeric" maxlength="10" required placeholder="10 digit mobile number"></label><label>Full Address<textarea name="address" rows="3" required placeholder="House no., mohalla, landmark..."></textarea></label><label>Village / Area<input name="area" required placeholder="Village / area"></label><div class="two"><label>PIN Code<input name="pin" inputmode="numeric" required></label><label>Distance from Ghughri (KM)<input name="distance" type="number" min="0" max="10" step="0.1" required></label></div><div class="payment">💵 <b>Cash on Delivery</b><br><small>Payment product delivery ke time dena hai.</small></div><button class="btn full">Place COD Order →</button></form></div><aside><small>YOUR ORDER</small><h2>Order Summary</h2><div id="s"></div><div class="payment">🚚 Delivery area: <b>Ghughri + 10 KM</b></div></aside></main><script>
const c=JSON.parse(localStorage.getItem('vmw_cart')||'[]'),p=JSON.parse(localStorage.getItem('vmw_products')||'[]');let t=0;document.getElementById('s').innerHTML=c.map(x=>{let z=p.find(y=>y.id===x.id);if(!z)return '';t+=z.price*x.qty;return `<div class="row"><b>${z.name}</b><span>₹${z.price} · ${x.size} · ×${x.qty}</span></div>`}).join('')+`<h3>Total: ₹${t.toLocaleString('en-IN')}</h3>`;
document.getElementById('f').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(+d.distance>10)return alert('Delivery sirf Ghughri se 10 KM ke andar available hai.');if(!/^[0-9]{10}$/.test(d.mobile))return alert('10 digit mobile number daalein.');let id='VMW'+Date.now().toString().slice(-8),orders=JSON.parse(localStorage.getItem('vmw_orders')||'[]');orders.push({id,status:'New',payment:'COD',createdAt:new Date().toISOString(),customer:d,items:c,total:t});localStorage.setItem('vmw_orders',JSON.stringify(orders));let msg=`Hello Vicky Mans Wear,%0AOrder ID: ${id}%0ATotal: ₹${t}%0ACustomer: ${encodeURIComponent(d.name)}%0AMobile: ${d.mobile}%0AAddress: ${encodeURIComponent(d.address+', '+d.area+', '+d.pin)}%0ADelivery: ${d.distance} KM%0APayment: COD`;localStorage.removeItem('vmw_cart');alert('Order placed! Order ID: '+id);window.open('https://wa.me/918815033967?text='+msg,'_blank');location.href='index.html'};
</script></body></html>
