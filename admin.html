<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Vicky Mans Wear</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="login"><div class="box"><div class="logo">VM</div><small>PRIVATE ADMIN</small><h1>Vicky Mans Wear</h1><form id="lf"><label>Username<input id="u" required></label><label>Password<input id="pw" type="password" required></label><button class="btn full">Continue</button></form><div id="otp" hidden><p>Real SMS OTP production setup ke baad yahan aayega.</p><label>OTP<input id="oi" maxlength="6" inputmode="numeric"></label><button class="btn full" onclick="verify()">Verify</button><p id="demo"></p></div><a href="index.html">← Back to shop</a></div></div><div id="panel" hidden><header><a class="brand" href="index.html">VM <b>Vicky Mans Wear Admin</b></a><button onclick="logout()">Logout</button></header><main><div class="adminhead"><div><small>CONTROL CENTER</small><h1>Products & Orders</h1></div><button class="btn" onclick="addP()">+ Add Product</button></div><h2>Products</h2><div id="plist"></div><h2>Orders</h2><div id="olist"></div></main></div><div id="pm" class="modal"><div class="box"><button class="x" onclick="closeP()">×</button><h2>Product</h2><form id="pf"><input type="hidden" name="id"><label>Name<input name="name" required></label><div class="two"><label>Category<input name="category" required></label><label>Price<input name="price" type="number" required></label></div><label>Sizes<input name="sizes" value="S,M,L,XL,XXL"></label><label>Badge<input name="badge"></label><label>Details<textarea name="details"></textarea></label><label>Image path<input name="image" placeholder="images/product.jpg"></label><button class="btn full">Save</button></form></div></div><script>const PK='vmw_products',OK='vmw_orders';let otp='';function ps(){return JSON.parse(localStorage.getItem(PK)||'[]')}function save(a){localStorage.setItem(PK,JSON.stringify(a))}document.getElementById('lf').onsubmit=e=>{e.preventDefault();if(document.getElementById('u').value!=='deva'||document.getElementById('pw').value!=='@54321')return alert('Username ya password galat hai.');document.getElementById('lf').hidden=true;document.getElementById('otp').hidden=false;otp=String(Math.floor(100000+Math.random()*900000));document.getElementById('demo').textContent='DEMO OTP: '+otp+' (real SMS OTP needs backend/SMS provider)'};function verify(){if(document.getElementById('oi').value!==otp)return alert('Wrong OTP');sessionStorage.vmw='1';location.reload()}function logout(){sessionStorage.removeItem('vmw');location.reload()}function addP(){document.getElementById('pf').reset();document.querySelector('[name=id]').value='';document.getElementById('pm').classList.add('show')}function edit(id){let p=ps().find(x=>x.id===id),f=document.getElementById('pf');Object.keys(p).forEach(k=>{if(f.elements[k])f.elements[k].value=Array.isArray(p[k])?p[k].join(','):p[k]});document.getElementById('pm').classList.add('show')}function closeP(){document.getElementById('pm').classList.remove('show')}function del(id){if(confirm('Delete?')){save(ps().filter(p=>p.id!==id));render()}}document.getElementById('pf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=d.id||'p'+Date.now();d.price=+d.price;d.sizes=d.sizes.split(',').map(x=>x.trim()).filter(Boolean);let a=ps(),i=a.findIndex(x=>x.id===d.id);i<0?a.push(d):a[i]=d;save(a);closeP();render()};function render(){document.getElementById('plist').innerHTML=ps().map(p=>`<div class="adminrow"><b>${p.name}</b><span>₹${p.price} · ${p.category} · ${p.sizes.join(', ')} <button onclick="edit('${p.id}')">Edit</button> <button onclick="del('${p.id}')">Delete</button></span></div>`).join('');let os=JSON.parse(localStorage.getItem(OK)||'[]');document.getElementById('olist').innerHTML=os.slice().reverse().map(o=>`<div class="order"><b>${o.id}</b> · ${o.status} · COD · ₹${o.total}<p>${o.customer.name} · ${o.customer.mobile}<br>${o.customer.address}, ${o.customer.area}, ${o.customer.pin}<br>${o.customer.distance} KM</p><select onchange="st('${o.id}',this.value)">${['New','Confirmed','Packed','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p>No orders yet.</p>'}function st(id,s){let o=JSON.parse(localStorage.getItem(OK)||'[]'),x=o.find(y=>y.id===id);if(x)x.status=s;localStorage.setItem(OK,JSON.stringify(o));render()}if(sessionStorage.vmw==='1'){login.hidden=true;panel.hidden=false;render()}</script></body></html>
